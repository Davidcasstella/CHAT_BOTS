<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Rojo - Cargando...</title>
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background: #000000;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.intro-container {
    position: relative;
    text-align: center;
    z-index: 10;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.intro-container.fade-out {
    animation: fadeOut 1s ease-out forwards;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        transform: scale(0.8);
    }
}

/* Video de fondo */
.dragon-animation {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100vw;
    height: 100vh;
    z-index: 1;
    opacity: 0.4;
    animation: dragonEntry 1.2s ease-out;
}

.dragon-animation video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

@keyframes dragonEntry {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }
    100% {
        opacity: 0.4;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* Textos al frente */
.text-restaurante {
    color: #FFD700;
    font-size: 4em;
    font-weight: bold;
    letter-spacing: 15px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeInUp 0.8s ease-out 0.5s forwards;
    text-shadow: 
        0 0 30px rgba(255, 215, 0, 1),
        0 0 60px rgba(255, 215, 0, 0.8),
        3px 3px 10px rgba(0, 0, 0, 0.9);
    z-index: 20;
    position: relative;
}

.text-dragon-rojo {
    color: #FF0000;
    font-size: 6em;
    font-weight: bold;
    letter-spacing: 20px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeInScale 1s ease-out 1s forwards;
    text-shadow: 
        0 0 40px rgba(255, 0, 0, 1),
        0 0 80px rgba(255, 0, 0, 0.8),
        0 0 120px rgba(255, 0, 0, 0.6),
        5px 5px 15px rgba(0, 0, 0, 0.9);
    margin-top: 20px;
    z-index: 20;
    position: relative;
}

@keyframes fadeInUp {
    0% {
        opacity: 0;
        transform: translateY(50px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInScale {
    0% {
        opacity: 0;
        transform: scale(0.3);
    }
    60% {
        transform: scale(1.15);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* Efectos de fondo */
.bg-effects {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.red-glow {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255, 0, 0, 0.3) 0%, transparent 70%);
    border-radius: 50%;
    animation: pulseGlow 3s ease-in-out infinite;
}

.glow-1 {
    top: 20%;
    left: 20%;
    animation-delay: 0s;
}

.glow-2 {
    bottom: 20%;
    right: 20%;
    animation-delay: 1s;
}

.glow-3 {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    animation-delay: 0.5s;
}

@keyframes pulseGlow {
    0%, 100% {
        opacity: 0.2;
        transform: scale(1);
    }
    50% {
        opacity: 0.5;
        transform: scale(1.2);
    }
}

/* Partículas de fuego */
.fire-particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #FF4500;
    border-radius: 50%;
    animation: floatUp 4s ease-out infinite;
    opacity: 0;
    z-index: 2;
}

@keyframes floatUp {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    100% {
        opacity: 0;
        transform: translateY(-100vh) scale(0);
    }
}

.particle-1 { left: 20%; bottom: 0; animation-delay: 0s; }
.particle-2 { left: 40%; bottom: 0; animation-delay: 0.8s; }
.particle-3 { left: 60%; bottom: 0; animation-delay: 1.6s; }
.particle-4 { left: 80%; bottom: 0; animation-delay: 2.4s; }
.particle-5 { left: 30%; bottom: 0; animation-delay: 3.2s; }
.particle-6 { left: 70%; bottom: 0; animation-delay: 4s; }

/* Líneas decorativas */
.decorative-line {
    position: absolute;
    height: 3px;
    background: linear-gradient(90deg, transparent, #FF0000, transparent);
    animation: expandLine 1s ease-out 1.5s forwards;
    width: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
}

.line-top {
    top: 30%;
}

.line-bottom {
    bottom: 30%;
}

@keyframes expandLine {
    to {
        width: 60%;
    }
}

/* Mensaje de carga */
.loading-text {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #FFD700;
    font-size: 1.2em;
    letter-spacing: 4px;
    opacity: 0;
    animation: blink 1.8s ease-in-out 2s infinite;
    z-index: 20;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
}

@keyframes blink {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

/* Responsive */
@media (max-width: 768px) {
    .text-restaurante {
        font-size: 2.5em;
        letter-spacing: 8px;
    }
    
    .text-dragon-rojo {
        font-size: 3.5em;
        letter-spacing: 10px;
    }
    
    .loading-text {
        font-size: 1em;
        bottom: 50px;
    }
}
    </style>
</head>
<body>
    <!-- Efectos de fondo -->
    <div class="bg-effects">
        <div class="red-glow glow-1"></div>
        <div class="red-glow glow-2"></div>
        <div class="red-glow glow-3"></div>
        
        <!-- Partículas de fuego -->
        <div class="fire-particle particle-1"></div>
        <div class="fire-particle particle-2"></div>
        <div class="fire-particle particle-3"></div>
        <div class="fire-particle particle-4"></div>
        <div class="fire-particle particle-5"></div>
        <div class="fire-particle particle-6"></div>
    </div>

    <!-- Líneas decorativas -->
    <div class="decorative-line line-top"></div>
    <div class="decorative-line line-bottom"></div>

    <!-- Contenedor principal -->
    <div class="intro-container" id="introContainer">
        <div class="dragon-animation">
            <video autoplay muted loop playsinline preload="auto">
                <source src="quiero-que-le-des-movimiento-a-este-dragon-veed_motion.mp4" type="video/mp4">
            </video>
        </div>
        <div class="text-restaurante">Restaurante</div>
        <div class="text-dragon-rojo">Dragon Rojo</div>
    </div>

    <!-- Texto de carga -->
    <div class="loading-text">Preparando tu experiencia gastronómica...</div>

    <script>
        // Verificar si el video existe y puede reproducirse
        const video = document.querySelector('video');
        
        video.addEventListener('loadeddata', () => {
            console.log('✅ Video cargado correctamente');
        });
        
        video.addEventListener('error', (e) => {
            console.error('❌ Error cargando el video:', e);
        });
        
        // Mostrar la animación durante 5 segundos (cambia este número)
        setTimeout(() => {
            const container = document.getElementById('introContainer');
            container.classList.add('fade-out');
            
            // Marcar que venimos de la animación
            sessionStorage.setItem('fromIntro', 'true');
            
            // Redirigir a restaurante.html después de la animación de fade out
            setTimeout(() => {
                window.location.href = 'restaurante.html';
            }, 1000);
        }, 2000); // ⬅️ CAMBIA ESTE NÚMERO (en milisegundos)
    </script>
</body>
</html>
