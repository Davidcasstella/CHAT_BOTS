<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: #000000;
        }

        /* Pantalla de Animación Inicial */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a0033 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, transform 1s ease;
            overflow: hidden;
        }

        #welcome-screen.hide {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            filter: blur(0px);
            transition: filter 0.5s ease;
        }

        .glow-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }

        .welcome-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
        }

        .brand-name {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: fadeInScale 1s ease;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(138, 43, 226, 0.5);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .tagline {
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            font-weight: 300;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease 0.3s both;
            letter-spacing: 2px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeInUp 1s ease 0.6s both;
        }

        .loading-bar {
            width: 300px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            animation: load 3s ease forwards;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
        }

        @keyframes load {
            to { width: 100%; }
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Fondo con partículas animadas */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(138, 43, 226, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.8);
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) translateX(100px) scale(0.5);
                opacity: 0;
            }
        }

        /* Contenedor del Formulario */
        #form-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease 0.5s, transform 1s ease 0.5s;
            background: radial-gradient(ellipse at top, #1a0033 0%, #000000 100%);
        }

        #form-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .form-wrapper {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5), 
                        0 0 0 1px rgba(138, 43, 226, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .form-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(138, 43, 226, 0.1), transparent 30%);
            animation: rotate 4s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .form-content-wrapper {
            position: relative;
            z-index: 1;
        }

        .tabs {
            display: flex;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 5px;
            position: relative;
        }

        .tab-indicator {
            position: absolute;
            height: calc(100% - 10px);
            width: calc(50% - 5px);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            transition: transform 0.3s ease;
            top: 5px;
            left: 5px;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .tabs[data-active="register"] .tab-indicator {
            transform: translateX(100%);
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .tab.active {
            color: white;
        }

        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: white;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1),
                        0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            color: rgba(255, 255, 255, 0.4);
            position: relative;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: white;
            font-size: 14px;
        }

        .social-btn:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .forgot-password {
            text-align: right;
            margin-top: 10px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .brand-name {
                font-size: 48px;
            }
            
            .form-wrapper {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Pantalla de bienvenida animada -->
    <div id="welcome-screen">
        <div class="canvas-container">
            <canvas id="canvas3d"></canvas>
        </div>
        <div class="glow-effect"></div>
        <div class="welcome-content">
            <h1 class="brand-name">AURORA</h1>
            <p class="tagline">El Futuro de la Conexión</p>
            <div class="loading-container">
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
                <span class="loading-text">Cargando...</span>
            </div>
        </div>
    </div>

    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <!-- Contenedor del formulario -->
    <div id="form-container">
        <div class="form-wrapper">
            <div class="form-content-wrapper">
                <div class="tabs" data-active="login">
                    <div class="tab-indicator"></div>
                    <div class="tab active" data-tab="login">Iniciar Sesión</div>
                    <div class="tab" data-tab="register">Registrarse</div>
                </div>

                <!-- Formulario de Login -->
                <div class="form-content active" id="login">
                    <h2>Bienvenido de Vuelta</h2>
                    <form>
                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" placeholder="tu@email.com" required>
                        </div>
                        <div class="input-group">
                            <label>Contraseña</label>
                            <input type="password" placeholder="••••••••" required>
                        </div>
                        <div class="forgot-password">
                            <a href="#">¿Olvidaste tu contraseña?</a>
                        </div>
                        <br>
                        <button type="submit" class="btn">Iniciar Sesión</button>
                    </form>
                    <div class="divider">o continúa con</div>
                    <div class="social-login">
                        <button class="social-btn">Google</button>
                        <button class="social-btn">Facebook</button>
                    </div>
                </div>

                <!-- Formulario de Registro -->
                <div class="form-content" id="register">
                    <h2>Crea tu Cuenta</h2>
                    <form>
                        <div class="input-group">
                            <label>Nombre completo</label>
                            <input type="text" placeholder="Juan Pérez" required>
                        </div>
                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" placeholder="tu@email.com" required>
                        </div>
                        <div class="input-group">
                            <label>Contraseña</label>
                            <input type="password" placeholder="••••••••" required>
                        </div>
                        <div class="input-group">
                            <label>Confirmar contraseña</label>
                            <input type="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn">Crear Cuenta</button>
                    </form>
                    <div class="divider">o regístrate con</div>
                    <div class="social-login">
                        <button class="social-btn">Google</button>
                        <button class="social-btn">Facebook</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Animación 3D de partículas ultra sofisticada
        const canvas = document.getElementById('canvas3d');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        const particles = [];
        const particleCount = 2000;
        const radius = 150;
        const waveAmplitude = 30;
        
        class Particle3D {
            constructor(index) {
                this.index = index;
                this.theta = Math.random() * Math.PI * 2;
                this.phi = Math.acos(2 * Math.random() - 1);
                this.radius = radius;
                
                this.update(0);
                
                this.hue = (this.theta / (Math.PI * 2)) * 360;
                this.size = Math.random() * 2 + 0.5;
                this.baseSize = this.size;
                this.speedTheta = (Math.random() - 0.5) * 0.01;
                this.speedPhi = (Math.random() - 0.5) * 0.005;
            }
            
            update(time) {
                this.theta += this.speedTheta;
                this.phi += this.speedPhi;
                
                const wave = Math.sin(time * 0.001 + this.theta * 3) * waveAmplitude;
                const dynamicRadius = this.radius + wave;
                
                this.x = dynamicRadius * Math.sin(this.phi) * Math.cos(this.theta);
                this.y = dynamicRadius * Math.sin(this.phi) * Math.sin(this.theta);
                this.z = dynamicRadius * Math.cos(this.phi);
                
                const rotX = time * 0.0003;
                const rotY = time * 0.0005;
                const rotZ = time * 0.0004;
                
                let x = this.x;
                let y = this.y * Math.cos(rotX) - this.z * Math.sin(rotX);
                let z = this.y * Math.sin(rotX) + this.z * Math.cos(rotX);
                
                let x2 = x * Math.cos(rotY) + z * Math.sin(rotY);
                let z2 = -x * Math.sin(rotY) + z * Math.cos(rotY);
                
                let x3 = x2 * Math.cos(rotZ) - y * Math.sin(rotZ);
                let y3 = x2 * Math.sin(rotZ) + y * Math.cos(rotZ);
                
                this.projX = x3 + canvas.width / 2;
                this.projY = y3 + canvas.height / 2;
                this.projZ = z2;
                
                this.hue = (this.theta / (Math.PI * 2)) * 360 + time * 0.05;
            }
            
            draw() {
                const scale = 300 / (300 + this.projZ);
                const x = this.projX;
                const y = this.projY;
                const size = this.baseSize * scale * 2;
                
                const brightness = ((this.projZ + radius + waveAmplitude) / ((radius + waveAmplitude) * 2));
                const alpha = 0.4 + brightness * 0.6;
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, size * 2);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, ${50 + brightness * 30}%, ${alpha})`);
                gradient.addColorStop(0.5, `hsla(${this.hue}, 100%, ${40 + brightness * 20}%, ${alpha * 0.5})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, ${30 + brightness * 10}%, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle3D(i));
        }
        
        // Partículas de conexión
        const connections = [];
        
        function drawConnections() {
            connections.length = 0;
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    
                    const dx = p1.projX - p2.projX;
                    const dy = p1.projY - p2.projY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 80 && Math.random() > 0.97) {
                        const avgZ = (p1.projZ + p2.projZ) / 2;
                        const brightness = ((avgZ + radius) / (radius * 2));
                        const alpha = (1 - distance / 80) * 0.2 * brightness;
                        
                        ctx.strokeStyle = `rgba(138, 43, 226, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p1.projX, p1.projY);
                        ctx.lineTo(p2.projX, p2.projY);
                        ctx.stroke();
                    }
                }
            }
        }
        
        function animate() {
            const time = Date.now();
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => p.update(time));
            particles.sort((a, b) => b.projZ - a.projZ);
            
            drawConnections();
            
            particles.forEach(p => p.draw());
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // Crear partículas de fondo
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 80; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (Math.random() * 15 + 15) + 's';
            particlesContainer.appendChild(particle);
        }

        // Animación de entrada
        setTimeout(() => {
            document.getElementById('welcome-screen').classList.add('hide');
            setTimeout(() => {
                document.getElementById('form-container').classList.add('show');
            }, 500);
        }, 3500);

        // Cambio entre tabs
        const tabs = document.querySelectorAll('.tab');
        const formContents = document.querySelectorAll('.form-content');
        const tabsContainer = document.querySelector('.tabs');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;
                
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                tabsContainer.dataset.active = targetTab;
                
                formContents.forEach(content => {
                    content.classList.remove('active');
                    if (content.id === targetTab) {
                        content.classList.add('active');
                    }
                });
            });
        });

        // Prevenir envío de formularios
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                alert('¡Formulario enviado! (Esto es una demo)');
            });
        });
    </script>
</body>
</html>
