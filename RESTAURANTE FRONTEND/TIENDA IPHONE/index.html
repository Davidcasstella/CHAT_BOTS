<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutletTechBoyacá - Bienvenido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        #welcome-screen.hide {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        /* Partículas de fondo doradas */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
            animation: float 25s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Video Container con efectos */
        .video-container {
            position: relative;
            width: 80%;
            max-width: 350px;
            margin: 0 auto;
            z-index: 10;
            opacity: 0;
            animation: fadeInVideo 1.5s ease 0.5s forwards;
        }

        @keyframes fadeInVideo {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .video-wrapper {
            position: relative;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(212, 175, 55, 0.4),
                0 0 120px rgba(212, 175, 55, 0.2),
                inset 0 0 80px rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.9) 0%, rgba(10, 10, 10, 0.9) 100%);
        }

        #introVideo {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 28px;
        }

        /* Brillo orbital alrededor del video */
        .video-glow {
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 32px;
            background: linear-gradient(45deg, 
                transparent 0%,
                rgba(212, 175, 55, 0.4) 25%,
                rgba(255, 215, 0, 0.6) 50%,
                rgba(212, 175, 55, 0.4) 75%,
                transparent 100%);
            background-size: 200% 200%;
            animation: glowRotate 4s linear infinite;
            z-index: -1;
            filter: blur(15px);
        }

        @keyframes glowRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Branding debajo del video */
        .brand-container {
            text-align: center;
            margin-top: 40px;
            opacity: 0;
            animation: fadeInBrand 1.5s ease 1s forwards;
        }

        @keyframes fadeInBrand {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-text {
            margin-bottom: 15px;
        }

        .text-outlet {
            color: #ffffff;
            font-size: 1.8em;
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            margin-bottom: 5px;
        }

        .text-tech {
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 3em;
            font-weight: 700;
            letter-spacing: -1px;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6));
        }

        .text-subtitle {
            color: #999;
            font-size: 1em;
            font-weight: 400;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        /* Loading elegante */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            border-radius: 28px;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid #D4AF37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #D4AF37;
            font-size: 1.1em;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* Anillos orbitales decorativos */
        .orbital-ring {
            position: fixed;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        .ring-1 {
            width: 400px;
            height: 400px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotateOrbit 20s linear infinite;
        }

        .ring-2 {
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotateOrbit 30s linear infinite reverse;
        }

        .ring-3 {
            width: 800px;
            height: 800px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotateOrbit 40s linear infinite;
        }

        @keyframes rotateOrbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .video-container {
                width: 95%;
            }

            .text-outlet {
                font-size: 1.4em;
            }
            
            .text-tech {
                font-size: 2.2em;
            }

            .text-subtitle {
                font-size: 0.9em;
                padding: 0 20px;
            }

            .brand-container {
                margin-top: 30px;
            }

            .ring-1 { width: 250px; height: 250px; }
            .ring-2 { width: 400px; height: 400px; }
            .ring-3 { width: 550px; height: 550px; }
        }
    </style>
</head>
<body>
    <!-- Partículas doradas de fondo -->
    <div class="particles" id="particles"></div>

    <!-- Anillos orbitales decorativos -->
    <div class="orbital-ring ring-1"></div>
    <div class="orbital-ring ring-2"></div>
    <div class="orbital-ring ring-3"></div>

    <div id="welcome-screen">
        <div class="video-container">
            <div class="video-wrapper">
                <div class="video-glow"></div>
                
                <!-- Loading overlay -->
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Cargando experiencia...</div>
                </div>

                <!-- Video de intro -->
                <video id="introVideo" muted playsinline>
                    <source src="Video.mp4" type="video/mp4">
                    Tu navegador no soporta el elemento de video.
                </video>
            </div>

            <!-- Branding debajo del video -->
            <div class="brand-container">
                <div class="brand-text">
                    <div class="text-outlet">OutletTech</div>
                    <div class="text-tech">Boyacá</div>
                    <div class="text-subtitle">iPhone originales. Garantía y confianza.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('introVideo');
        const welcomeScreen = document.getElementById('welcome-screen');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const particlesContainer = document.getElementById('particles');

        // Crear partículas doradas
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (Math.random() * 15 + 20) + 's';
            particlesContainer.appendChild(particle);
        }

        // Ocultar loading cuando el video esté listo
        video.addEventListener('loadeddata', () => {
            setTimeout(() => {
                loadingOverlay.classList.add('hide');
                // Intentar reproducir el video
                const playPromise = video.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log('Reproducción automática bloqueada, intentando con interacción');
                        // Si falla, esperar clic del usuario
                        document.addEventListener('click', () => {
                            video.play();
                        }, { once: true });
                    });
                }
            }, 500);
        });

        // Cuando el video termine, ir a la tienda
        video.addEventListener('ended', () => {
            goToStore();
        });

        // Si hay error cargando el video, ir directo a la tienda después de 3 segundos
        video.addEventListener('error', () => {
            console.error('Error al cargar el video');
            setTimeout(() => {
                goToStore();
            }, 3000);
        });

        // Función para ir a la tienda con transición elegante
        function goToStore() {
            welcomeScreen.classList.add('hide');
            setTimeout(() => {
                sessionStorage.setItem('fromIntro', 'true');
                window.location.href = 'tienda.html';
            }, 1500);
        }

        // Permitir clic en cualquier parte para avanzar (opcional)
        let canSkip = false;
        setTimeout(() => {
            canSkip = true;
        }, 3000); // Permitir saltar después de 3 segundos

        document.addEventListener('click', () => {
            if (canSkip) {
                video.pause();
                goToStore();
            }
        });
    </script>
</body>
</html>
